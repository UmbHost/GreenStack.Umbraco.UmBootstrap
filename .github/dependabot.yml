version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      umbraco:
        patterns:
          - "Umbraco.Cms"
          - "Umbraco.Cms.*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
